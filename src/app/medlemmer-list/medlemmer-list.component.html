<div class="settings-page">
    <div class="banner">
        <div class="container">
          <h1 class="logo-font">{{ members?.length ? members.length + ' brugere på forummet' : 'Brugere på forummet' }}</h1>
          <div class="article-meta">
              <div class="info">
                  <span class="author"></span>
                  <span class="date"></span>
                  <span class="date" style="padding-top: 5px;"></span>
              </div>
            </div>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="container page">
            <div class="col-md-12">
                <table style="width: 100%" [hidden]="!members?.length">
                    <thead>
                        <th>Navn</th>
                        <th>Email</th>
                        <th>Adresse</th>
                    </thead>
                    <tbody>
                        <tr *ngFor="let member of members">
                            <td>{{ member.name }}</td>
                            <td><a href="mailto:{{ member.email }}">{{ member.email }}</a></td>
                            <td>{{ member.address }}</td>
                        </tr>
                    </tbody>
                </table>

                <div class="app-bruger-preview" [hidden]="!loading">
                    Henter brugere...
                </div>

                <div class="app-bruger-preview" [hidden]="loading || error || members?.length">
                    Der er endnu ikke nogle brugere.
                </div>

                <div class="app-bruger-preview" [hidden]="!error">
                    {{ error }}
                </div>
            </div>
        </div>
    </div>
</div>
