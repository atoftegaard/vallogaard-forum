<div class="settings-page">
    <div class="banner">
        <div class="container">
          <h1 class="logo-font">Dokumenter</h1>
          <div class="article-meta">
              <div class="info">
                  <span class="author"></span>
                  <span class="date"></span>
                  <span class="date" style="padding-top: 5px;"></span>
              </div>
            </div>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="container page">
            <div class="col-md-12">
                <div class="btn-wrapper" *ngIf="isAdmin">
                    <app-dokumenter-upload [existingCategories]="categoryNames" (uploaded)="loadDokumenter()"></app-dokumenter-upload>
                </div>

                <details class="category-group" *ngFor="let group of groups; trackBy: trackByCategory">
                    <summary class="category-header">
                        <span>{{ group.category }}</span>
                        <span class="category-count">{{ group.dokumenter.length }}</span>
                    </summary>
                    <div class="category-body">
                        <app-dokument-preview
                            *ngFor="let dokument of group.dokumenter; trackBy: trackByPath"
                            [dokument]="dokument"
                            [isAdmin]="isAdmin"
                            [existingCategories]="categoryNames"
                            (categoryChanged)="onCategoryChanged()"
                            (deleted)="onDokumentDeleted(dokument)">
                        </app-dokument-preview>
                    </div>
                </details>

                <div class="app-dokument-preview"
                    [hidden]="!loading">
                Henter dokumenter...
                </div>

                <div class="app-dokument-preview"
                    [hidden]="!(!loading && groups.length === 0)">
                    Der er endnu ikke lagt nogle dokumenter op.
                </div>
            </div>
        </div>
    </div>
</div>
